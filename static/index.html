<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GLM-OCR</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f5f7;
    --panel: #ffffff;
    --border: #d8d8dd;
    --text: #1c1c1e;
    --muted: #6b6b70;
    --accent: #2f6fed;
    --accent-hover: #2559c4;
    --ok: #1a7f37;
    --err: #c0392b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121214;
      --panel: #1c1c1f;
      --border: #303034;
      --text: #f0f0f2;
      --muted: #9a9aa0;
      --accent: #5b8def;
      --accent-hover: #7ba3f2;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 16px;
  }
  .wrap { max-width: 780px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 8px 0 4px; }
  .sub { color: var(--muted); font-size: 14px; margin-bottom: 20px; }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
  }

  .dropzone {
    border: 2px dashed var(--border);
    border-radius: 10px;
    padding: 32px 16px;
    text-align: center;
    cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .dropzone.drag { border-color: var(--accent); background: rgba(47,111,237,.06); }
  .dropzone p { margin: 6px 0; color: var(--muted); font-size: 14px; }
  .dropzone strong { color: var(--text); }
  #fileInput { display: none; }

  #preview {
    max-width: 100%;
    max-height: 260px;
    border-radius: 8px;
    margin-top: 14px;
    display: none;
  }

  .row {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
    margin-top: 16px;
  }

  select, button {
    font-size: 14px;
    padding: 9px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
  }

  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    cursor: pointer;
    font-weight: 600;
  }
  button.primary:hover { background: var(--accent-hover); }
  button.primary:disabled { opacity: .5; cursor: default; }

  button.ghost { cursor: pointer; }
  button.ghost:hover { background: var(--bg); }

  .status { font-size: 13px; margin-left: auto; color: var(--muted); }
  .status.ok { color: var(--ok); }
  .status.err { color: var(--err); }

  textarea {
    width: 100%;
    min-height: 220px;
    margin-top: 14px;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 13px;
    line-height: 1.5;
    resize: vertical;
  }

  .hidden { display: none !important; }
  .spinner {
    width: 14px; height: 14px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .7s linear infinite;
    display: inline-block;
    vertical-align: -2px;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="wrap">
  <h1>GLM-OCR</h1>
  <div class="sub">Завантаж зображення — отримай розпізнаний текст</div>

  <div class="panel">
    <div class="dropzone" id="dropzone">
      <p><strong>Перетягни зображення сюди</strong> або натисни, щоб обрати файл</p>
      <p>PNG, JPG, WEBP</p>
      <input type="file" id="fileInput" accept="image/*">
    </div>
    <img id="preview" alt="Прев'ю">

    <div class="row">
      <select id="mode">
        <option value="text">Текст</option>
        <option value="table">Таблиця</option>
        <option value="figure">Фігура/схема</option>
      </select>
      <button class="primary" id="runBtn" disabled>Розпізнати</button>
      <span class="status" id="status"></span>
    </div>
    <div class="row" id="tokenRow" style="margin-top:10px">
      <input type="password" id="tokenInput" placeholder="API токен (якщо увімкнено на сервері)"
             style="flex:1; min-width:220px; font-size:13px; padding:8px 10px; border-radius:8px; border:1px solid var(--border); background:var(--panel); color:var(--text)">
    </div>
  </div>

  <div class="panel hidden" id="resultPanel">
    <div class="row" style="margin-top:0">
      <strong>Результат</strong>
      <button class="ghost" id="copyBtn" style="margin-left:auto">Скопіювати</button>
    </div>
    <textarea id="resultText" readonly></textarea>
  </div>
</div>

<script>
  const dropzone = document.getElementById('dropzone');
  const fileInput = document.getElementById('fileInput');
  const preview = document.getElementById('preview');
  const runBtn = document.getElementById('runBtn');
  const modeSel = document.getElementById('mode');
  const statusEl = document.getElementById('status');
  const resultPanel = document.getElementById('resultPanel');
  const resultText = document.getElementById('resultText');
  const copyBtn = document.getElementById('copyBtn');
  const tokenInput = document.getElementById('tokenInput');

  let selectedFile = null;

  try {
    tokenInput.value = localStorage.getItem('glm_ocr_token') || '';
  } catch {}
  tokenInput.addEventListener('change', () => {
    try { localStorage.setItem('glm_ocr_token', tokenInput.value); } catch {}
  });

  function setStatus(text, kind) {
    statusEl.textContent = text || '';
    statusEl.className = 'status' + (kind ? ' ' + kind : '');
  }

  function pickFile(file) {
    if (!file || !file.type.startsWith('image/')) {
      setStatus('Обери файл зображення', 'err');
      return;
    }
    selectedFile = file;
    preview.src = URL.createObjectURL(file);
    preview.style.display = 'block';
    runBtn.disabled = false;
    setStatus('');
    resultPanel.classList.add('hidden');
  }

  dropzone.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', (e) => pickFile(e.target.files[0]));

  ['dragenter', 'dragover'].forEach(evt =>
    dropzone.addEventListener(evt, (e) => { e.preventDefault(); dropzone.classList.add('drag'); })
  );
  ['dragleave', 'drop'].forEach(evt =>
    dropzone.addEventListener(evt, (e) => { e.preventDefault(); dropzone.classList.remove('drag'); })
  );
  dropzone.addEventListener('drop', (e) => {
    const file = e.dataTransfer.files && e.dataTransfer.files[0];
    pickFile(file);
  });

  // Paste from clipboard (screenshot -> Cmd/Ctrl+V)
  document.addEventListener('paste', (e) => {
    const items = e.clipboardData && e.clipboardData.items;
    if (!items) return;
    for (const item of items) {
      if (item.type.startsWith('image/')) {
        pickFile(item.getAsFile());
        break;
      }
    }
  });

  runBtn.addEventListener('click', async () => {
    if (!selectedFile) return;
    runBtn.disabled = true;
    resultPanel.classList.add('hidden');

    const startedAt = Date.now();
    statusEl.className = 'status';
    statusEl.innerHTML = '<span class="spinner"></span>Розпізнаю... 0 с';
    const ticker = setInterval(() => {
      const s = Math.round((Date.now() - startedAt) / 1000);
      statusEl.innerHTML = '<span class="spinner"></span>Розпізнаю... ' + s + ' с'
        + (s > 60 ? ' (на слабкому залізі це може тривати кілька хвилин)' : '');
    }, 1000);

    const form = new FormData();
    form.append('file', selectedFile);
    form.append('mode', modeSel.value);
    form.append('output', 'json');

    const headers = {};
    if (tokenInput.value.trim()) {
      headers['Authorization'] = 'Bearer ' + tokenInput.value.trim();
    }

    try {
      const resp = await fetch('/ocr', { method: 'POST', body: form, headers });
      const data = await resp.json();
      if (!resp.ok) {
        throw new Error(data.detail || ('HTTP ' + resp.status));
      }
      resultText.value = data.text || '';
      resultPanel.classList.remove('hidden');
      if (data.truncated) {
        setStatus('Готово за ' + data.seconds + ' с, але схоже на зациклення (обрізано за лімітом токенів)', 'err');
      } else {
        setStatus('Готово за ' + data.seconds + ' с', 'ok');
      }
    } catch (err) {
      setStatus('Помилка: ' + err.message, 'err');
    } finally {
      clearInterval(ticker);
      runBtn.disabled = false;
    }
  });

  copyBtn.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(resultText.value);
      copyBtn.textContent = 'Скопійовано!';
    } catch {
      resultText.select();
      document.execCommand('copy');
      copyBtn.textContent = 'Скопійовано!';
    }
    setTimeout(() => { copyBtn.textContent = 'Скопіювати'; }, 1500);
  });
</script>
</body>
</html>
