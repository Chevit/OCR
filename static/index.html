<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OCR</title>
<link rel="stylesheet" href="/static/vendor/cropper.min.css">
<style>
  /* Scanner bed: the image lies on grey glass, the text comes out on paper. */
  :root {
    color-scheme: light dark;
    --bed: #E6EBEE;      /* page */
    --glass: #CDD6DC;    /* behind the image */
    --paper: #FFFFFF;    /* settings and result */
    --ink: #18202B;
    --graphite: #5A6472;
    --line: #CBD3D9;
    --lamp: #00806C;     /* primary action and scan line */
    --lamp-hover: #006B5A;
    --on-lamp: #FFFFFF;
    --err: #B42318;
    --reading: "PT Serif", "Noto Serif", Georgia, serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bed: #12171C;
      --glass: #0B0F13;
      --paper: #1B2229;
      --ink: #E8EDF1;
      --graphite: #93A0AC;
      --line: #2E3842;
      --lamp: #2BB59C;
      --lamp-hover: #4CC9B2;
      --on-lamp: #06201B;
      --err: #F97066;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bed);
    color: var(--ink);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  :focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px; }
  .hidden { display: none !important; }
  /* Touch screens can't drag files or use a mouse wheel. */
  .touch { display: none; }
  @media (hover: none) { .touch { display: inline; } .mouse { display: none !important; } }

  header {
    max-width: 1280px;
    margin: 0 auto;
    padding: 18px 20px 6px;
    display: flex;
    align-items: baseline;
    gap: 12px;
  }
  header h1 { font-size: 20px; margin: 0; letter-spacing: -.01em; }
  header p { margin: 0; color: var(--graphite); font-size: 14px; }

  .app {
    max-width: 1280px;
    margin: 0 auto;
    padding: 12px 20px 24px;
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: 20px;
  }
  @media (min-width: 960px) {
    .app { grid-template-columns: minmax(0, 7fr) minmax(380px, 5fr); align-items: start; }
    .bed { position: sticky; top: 12px; }
  }

  /* Left: the image */
  .dropzone {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 8px;
    width: 100%;
    min-height: min(70vh, 640px);
    padding: 32px 20px;
    font: inherit;
    color: var(--ink);
    background: var(--glass);
    border: 2px dashed var(--line);
    border-radius: 14px;
    cursor: pointer;
    text-align: center;
  }
  .dropzone strong { font-size: 18px; }
  .dropzone > span { color: var(--graphite); font-size: 14px; }
  .dropzone:hover, .dropzone.drag { border-color: var(--lamp); }
  .dropzone.drag { background: color-mix(in srgb, var(--lamp) 10%, var(--glass)); }
  #fileInput { display: none; }

  /* Cropper.js sizes its editor to this box, so it needs a fixed height. */
  .crop-box {
    position: relative;
    height: min(72vh, 760px);
    background: var(--glass);
    border-radius: 14px;
    overflow: hidden;
  }
  @media (max-width: 959px) { .crop-box { height: 55vh; } }
  .crop-box img { display: block; max-width: 100%; }
  .crop-box .cropper-modal { background: var(--glass); opacity: .6; }
  .crop-box .cropper-view-box { outline-color: var(--lamp); }
  .crop-box .cropper-line, .crop-box .cropper-point { background-color: var(--lamp); }

  /* While recognizing, a lamp line sweeps the page like a scanner. */
  .crop-box.scanning::after {
    content: "";
    position: absolute;
    left: 0; right: 0; top: 0;
    height: 3px;
    background: var(--lamp);
    box-shadow: 0 0 22px 6px color-mix(in srgb, var(--lamp) 55%, transparent);
    pointer-events: none;
    z-index: 5;
    animation: scan 2.6s ease-in-out infinite alternate;
  }
  @keyframes scan { to { top: calc(100% - 3px); } }
  @media (prefers-reduced-motion: reduce) {
    .crop-box.scanning::after { animation: none; top: auto; bottom: 0; }
  }

  .tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
  .hint { color: var(--graphite); font-size: 13px; }

  /* Right: settings and result, on paper */
  .sheet {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 14px;
  }
  .settings { margin: 0; padding: 18px 18px 0; border: 0; min-width: 0; }
  .group { margin: 0 0 16px; padding: 0; border: 0; min-width: 0; }
  .group legend { padding: 0; margin-bottom: 6px; font-size: 13px; font-weight: 600; color: var(--graphite); }

  .seg {
    display: flex;
    flex-wrap: wrap;
    gap: 3px;
    padding: 3px;
    background: var(--bed);
    border-radius: 10px;
  }
  .seg label { flex: 1 1 auto; position: relative; }
  .seg input { position: absolute; inset: 0; opacity: 0; margin: 0; }
  .seg span {
    display: block;
    padding: 7px 10px;
    border-radius: 7px;
    text-align: center;
    font-size: 14px;
    cursor: pointer;
    color: var(--graphite);
  }
  .seg small { display: block; font-size: 12px; }
  .seg input:checked + span {
    background: var(--paper);
    color: var(--ink);
    font-weight: 600;
    box-shadow: 0 1px 2px rgba(24, 32, 43, .12), 0 0 0 1px var(--line);
  }
  .seg input:checked + span small { font-weight: 400; color: var(--graphite); }
  .seg input:focus-visible + span { outline: 2px solid var(--lamp); outline-offset: 1px; }
  .settings:disabled .seg span { cursor: default; opacity: .6; }

  button, input[type="password"] {
    font: inherit;
    font-size: 14px;
    padding: 8px 14px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--ink);
  }
  input[type="password"] { width: 100%; }
  button { cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  button.ghost:hover:not(:disabled) { background: var(--bed); }
  button.icon { min-width: 40px; font-size: 20px; line-height: 1; padding: 6px 10px; }

  /* Stays in reach at the bottom of the screen on long pages and phones. */
  .run-bar {
    position: sticky;
    bottom: 0;
    z-index: 10;
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
    padding: 12px 18px;
    background: var(--paper);
    border-top: 1px solid var(--line);
    border-radius: 0 0 14px 14px;
  }
  button.primary {
    background: var(--lamp);
    border-color: var(--lamp);
    color: var(--on-lamp);
    font-weight: 600;
    font-size: 15px;
    padding: 10px 22px;
  }
  button.primary:hover:not(:disabled) { background: var(--lamp-hover); border-color: var(--lamp-hover); }
  button.stop { color: var(--err); border-color: currentColor; font-weight: 600; }
  .run-bar .hint { margin-left: auto; }

  .status { padding: 0 18px 14px; font-size: 14px; color: var(--graphite); }
  .status:empty { display: none; }
  .status.ok { color: var(--lamp); }
  .status.err { color: var(--err); }
  .spinner {
    width: 14px; height: 14px;
    border: 2px solid var(--line);
    border-top-color: var(--lamp);
    border-radius: 50%;
    animation: spin .7s linear infinite;
    display: inline-block;
    vertical-align: -2px;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .result { margin-top: 20px; padding: 16px 18px 18px; }
  .result-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .result-head h2 { font-size: 16px; margin: 0 auto 0 0; }
  .result-head button { font-size: 13px; padding: 6px 10px; }
  #confLegend { width: 100%; order: 5; }

  /* The transcript is set for reading and proofreading, not as code. */
  textarea, .transcript {
    width: 100%;
    font-family: var(--reading);
    font-size: 17px;
    line-height: 1.6;
    color: var(--ink);
  }
  textarea {
    display: block;
    min-height: 320px;
    padding: 4px 2px;
    border: 0;
    background: transparent;
    resize: vertical;
  }
  textarea:focus-visible { outline: 1px dashed var(--line); outline-offset: 6px; }
  .transcript { max-height: 70vh; overflow: auto; }

  /* Tesseract word confidence: sure words stay unmarked. */
  .transcript.words { white-space: pre-wrap; }
  .transcript.words span[title] { cursor: help; }
  .conf-mid { background: rgba(255, 196, 0, .4); border-radius: 3px; }
  .conf-low { background: rgba(230, 50, 50, .4); border-radius: 3px; }
</style>
</head>
<body>
<header>
  <h1>OCR</h1>
  <p>Текст із фото, сканів і знімків екрана</p>
</header>

<main class="app">
  <section class="bed" aria-label="Зображення">
    <button type="button" class="dropzone" id="dropzone">
      <strong class="mouse">Перетягни зображення сюди</strong>
      <strong class="touch">Сфотографуй або обери зображення</strong>
      <span class="mouse">або натисни, щоб обрати файл, чи встав знімок екрана: Ctrl+V / ⌘V</span>
      <span>PNG, JPG, WEBP</span>
    </button>
    <input type="file" id="fileInput" accept="image/*">
    <div class="crop-box hidden" id="cropBox"><img id="preview" alt="Обране зображення"></div>
    <div class="tools hidden" id="cropTools">
      <button class="ghost icon" id="rotateLeftBtn" type="button" title="Повернути ліворуч" aria-label="Повернути ліворуч">⟲</button>
      <button class="ghost icon" id="rotateRightBtn" type="button" title="Повернути праворуч" aria-label="Повернути праворуч">⟳</button>
      <button class="ghost" id="resetCropBtn" type="button">Скинути</button>
      <button class="ghost" id="otherFileBtn" type="button">Інше зображення</button>
      <span class="hint">Потягни за кути рамки, щоб обрізати.<span class="mouse"> Колесо миші змінює масштаб.</span></span>
    </div>
  </section>

  <section aria-label="Розпізнавання">
    <div class="sheet">
      <form id="settingsForm" onsubmit="return false">
        <fieldset class="settings" id="settings">
          <fieldset class="group">
            <legend>Що на зображенні</legend>
            <div class="seg">
              <label><input type="radio" name="mode" value="text" checked><span>Текст</span></label>
              <label><input type="radio" name="mode" value="table"><span>Таблиця</span></label>
            </div>
          </fieldset>
          <fieldset class="group">
            <legend>Як розпізнати</legend>
            <div class="seg">
              <label><input type="radio" name="engine" value="tesseract" checked><span>Швидко<small>секунди, Tesseract</small></span></label>
              <label><input type="radio" name="engine" value="deepseek"><span>ШІ-модель<small>хвилини, DeepSeek</small></span></label>
            </div>
          </fieldset>
          <fieldset class="group" id="speedField">
            <legend>Деталізація</legend>
            <div class="seg">
              <label><input type="radio" name="speedProfile" value="fast"><span>Низька<small>швидше</small></span></label>
              <label><input type="radio" name="speedProfile" value="balanced" checked><span>Середня<small>&nbsp;</small></span></label>
              <label><input type="radio" name="speedProfile" value="detailed"><span>Висока<small>повільніше</small></span></label>
            </div>
          </fieldset>
          <fieldset class="group" id="outputField">
            <legend>Що отримати</legend>
            <div class="seg">
              <label><input type="radio" name="output" value="json" checked><span>Текст</span></label>
              <label><input type="radio" name="output" value="tsv"><span>Текст з перевіркою слів</span></label>
              <label><input type="radio" name="output" value="pdf"><span>PDF з текстовим шаром</span></label>
            </div>
          </fieldset>
          <div class="group hidden" id="tokenRow">
            <label class="hint" for="tokenInput">Сервер вимагає API токен</label>
            <input type="password" id="tokenInput" autocomplete="off">
          </div>
        </fieldset>
      </form>
      <div class="status" id="status" role="status" aria-live="polite"></div>
      <div class="run-bar">
        <button class="primary" id="runBtn" type="button" disabled>Розпізнати</button>
        <button class="stop hidden" id="stopBtn" type="button">Зупинити</button>
        <span class="hint mouse">Ctrl+Enter / ⌘Enter</span>
      </div>
    </div>

    <div class="sheet result hidden" id="resultPanel">
      <div class="result-head">
        <h2>Результат</h2>
        <button class="ghost" id="copyBtn" type="button">Скопіювати</button>
        <button class="ghost" id="downloadBtn" type="button">Завантажити</button>
        <span class="hint hidden" id="confLegend">
          <span class="conf-mid">&nbsp;сумнівно&nbsp;</span> <span class="conf-low">&nbsp;ймовірно помилка&nbsp;</span> Натисни на слово, щоб побачити впевненість
        </span>
      </div>
      <div id="resultRendered" class="transcript hidden"></div>
      <textarea id="resultText" aria-label="Розпізнаний текст, можна редагувати"></textarea>
    </div>
  </section>
</main>

<!-- Served from this repo so the page works without internet access. -->
<script src="/static/vendor/cropper.min.js"></script>
<script>
  const dropzone = document.getElementById('dropzone');
  const fileInput = document.getElementById('fileInput');
  const preview = document.getElementById('preview');
  const cropBox = document.getElementById('cropBox');
  const cropTools = document.getElementById('cropTools');
  const cropButtons = cropTools.querySelectorAll('button');
  const runBtn = document.getElementById('runBtn');
  const stopBtn = document.getElementById('stopBtn');
  // Radio groups: .value reads and sets the checked option.
  const settingsForm = document.getElementById('settingsForm');
  const settings = document.getElementById('settings');
  const { engine: engineSel, speedProfile, mode: modeSel, output: outputSel } = settingsForm.elements;
  const confLegend = document.getElementById('confLegend');
  const statusEl = document.getElementById('status');
  const resultPanel = document.getElementById('resultPanel');
  const resultText = document.getElementById('resultText');
  const resultRendered = document.getElementById('resultRendered');
  const copyBtn = document.getElementById('copyBtn');
  const tokenInput = document.getElementById('tokenInput');
  const tokenRow = document.getElementById('tokenRow');
  const speedField = document.getElementById('speedField');
  const outputField = document.getElementById('outputField');
  const downloadBtn = document.getElementById('downloadBtn');
  const fmtSeconds = s => Number(s).toLocaleString('uk', { maximumFractionDigits: 1 });

  let selectedFile = null;
  let activeController = null;
  let cropper = null;
  const profiles = {
    fast: { megapixels: 0.5, maxPredict: 512 },
    balanced: { megapixels: 1, maxPredict: 1024 },
    detailed: { megapixels: 2, maxPredict: 2048 },
  };

  function selectedProfile() {
    return profiles[speedProfile.value] || profiles.balanced;
  }

  function setBusy(busy) {
    runBtn.disabled = busy || !selectedFile;
    settings.disabled = busy;
    cropBox.classList.toggle('scanning', busy);
    stopBtn.disabled = !busy;
    stopBtn.classList.toggle('hidden', !busy);
    dropzone.classList.toggle('busy', busy);
    cropButtons.forEach(b => { b.disabled = busy; });
    if (cropper) busy ? cropper.disable() : cropper.enable();
  }

  // The speed profile only tunes DeepSeek (image size, token limit).
  function updateEngineUi() {
    const isDeepseek = engineSel.value === 'deepseek';
    speedField.classList.toggle('hidden', !isDeepseek);
    // Word confidence and PDF come from Tesseract only.
    outputField.classList.toggle('hidden', isDeepseek);
    updateRunLabel();
  }

  // The button names what it will produce.
  function updateRunLabel() {
    const pdf = engineSel.value !== 'deepseek' && outputSel.value === 'pdf';
    runBtn.textContent = pdf ? 'Створити PDF' : 'Розпізнати';
  }

  // Confidence (0-100) at or above which a word counts as sure / doubtful.
  const CONF_SURE = 85, CONF_DOUBT = 60;

  // Tesseract TSV columns: level page block par line word left top width
  // height conf text. Level 5 rows are words; a new paragraph gets a blank line.
  function renderWords(tsv) {
    const lines = [];
    let lineKey = null, parKey = null, words = null;
    for (const row of tsv.split('\n').slice(1)) {
      const c = row.split('\t');
      if (c[0] !== '5' || !c[11] || !c[11].trim()) continue;
      const par = c[2] + '.' + c[3], line = par + '.' + c[4];
      if (line !== lineKey) {
        if (parKey !== null && par !== parKey) lines.push([]);
        lines.push(words = []);
        lineKey = line;
        parKey = par;
      }
      words.push({ text: c[11], conf: Number(c[10]) });
    }
    resultRendered.replaceChildren();
    lines.forEach((line, i) => {
      if (i) resultRendered.append('\n');
      line.forEach((w, j) => {
        if (j) resultRendered.append(' ');
        const span = document.createElement('span');
        span.textContent = w.text;
        span.title = '«' + w.text + '»: впевненість ' + Math.round(w.conf) + '%';
        if (w.conf < CONF_DOUBT) span.className = 'conf-low';
        else if (w.conf < CONF_SURE) span.className = 'conf-mid';
        resultRendered.append(span);
      });
    });
    return lines.map(line => line.map(w => w.text).join(' ')).join('\n');
  }

  function download(blob, name) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }
  try {
    const savedEngine = localStorage.getItem('ocr_engine');
    if ([...engineSel].some(r => r.value === savedEngine)) engineSel.value = savedEngine;
  } catch {}
  settingsForm.addEventListener('change', (e) => {
    if (e.target.name === 'engine') {
      try { localStorage.setItem('ocr_engine', engineSel.value); } catch {}
    }
    updateEngineUi();
  });
  updateEngineUi();

  try {
    tokenInput.value = localStorage.getItem('ocr_token') || '';
  } catch {}
  tokenRow.classList.toggle('hidden', !tokenInput.value);
  tokenInput.addEventListener('change', () => {
    try { localStorage.setItem('ocr_token', tokenInput.value); } catch {}
  });

  function setStatus(text, kind) {
    statusEl.textContent = text || '';
    statusEl.className = 'status' + (kind ? ' ' + kind : '');
  }

  function pickFile(file) {
    if (activeController) return;
    if (!file || !file.type.startsWith('image/')) {
      setStatus('Обери файл зображення', 'err');
      return;
    }
    selectedFile = file;
    if (cropper) cropper.destroy();
    if (preview.src) URL.revokeObjectURL(preview.src);
    preview.src = URL.createObjectURL(file);
    cropBox.classList.remove('hidden');
    cropTools.classList.remove('hidden');
    cropper = new Cropper(preview, {
      viewMode: 1,            // keep the frame inside the image
      autoCropArea: 1,        // start with the whole image selected
      background: false,
      // Dragging anywhere pans the image (also under the frame); the frame is
      // resized by its handles. Otherwise a frame that fills the view could
      // not be panned at all.
      dragMode: 'move',
      cropBoxMovable: false,
      toggleDragModeOnDblclick: false,
      // Modern browsers already apply the photo's EXIF rotation when drawing
      // the image; letting Cropper.js apply it again would rotate it twice.
      checkOrientation: false,
    });
    dropzone.classList.add('hidden');
    setBusy(false);
    setStatus('');
    resultPanel.classList.add('hidden');
  }

  // Cropper.js rotates the image in place, so a tall page turned sideways
  // spills out of the editor. Fit it back in and select the whole image.
  // The frame is dropped first: Cropper.js won't shrink the image below it.
  function rotate(degrees) {
    cropper.clear();
    cropper.rotate(degrees);
    const box = cropper.getContainerData();
    const image = cropper.getCanvasData();
    const k = Math.min(box.width / image.width, box.height / image.height);
    const width = image.width * k, height = image.height * k;
    cropper.setCanvasData({ left: (box.width - width) / 2, top: (box.height - height) / 2, width, height });
    cropper.crop();
    cropper.setCropBoxData(cropper.getCanvasData());
  }
  document.getElementById('rotateLeftBtn').addEventListener('click', () => rotate(-90));
  document.getElementById('rotateRightBtn').addEventListener('click', () => rotate(90));
  document.getElementById('otherFileBtn').addEventListener('click', () => fileInput.click());
  document.getElementById('resetCropBtn').addEventListener('click', () => {
    cropper.reset();
  });

  // The crop is exported at the original resolution, not the preview's.
  // JPEG keeps a full-page crop well under the 20 MB upload limit.
  function imageToSend() {
    // Zooming also changes which part the frame covers, so compare the frame
    // with the whole image instead of tracking edits.
    const d = cropper.getData(true), img = cropper.getImageData();
    const whole = d.rotate === 0 && d.x <= 0 && d.y <= 0
      && d.width >= img.naturalWidth && d.height >= img.naturalHeight;
    if (whole) return Promise.resolve(selectedFile);
    const canvas = cropper.getCroppedCanvas({ fillColor: '#fff', imageSmoothingQuality: 'high' });
    const name = selectedFile.name.replace(/\.[^.]*$/, '') + '-crop.jpg';
    return new Promise((resolve, reject) => canvas.toBlob(
      blob => blob ? resolve(new File([blob], name, { type: 'image/jpeg' }))
                   : reject(new Error('не вдалося обрізати зображення')),
      'image/jpeg', 0.95,
    ));
  }

  dropzone.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', (e) => {
    pickFile(e.target.files[0]);
    fileInput.value = '';  // picking the same file again still fires 'change'
  });

  ['dragenter', 'dragover'].forEach(evt =>
    dropzone.addEventListener(evt, (e) => { e.preventDefault(); dropzone.classList.add('drag'); })
  );
  ['dragleave', 'drop'].forEach(evt =>
    dropzone.addEventListener(evt, (e) => { e.preventDefault(); dropzone.classList.remove('drag'); })
  );
  dropzone.addEventListener('drop', (e) => {
    const file = e.dataTransfer.files && e.dataTransfer.files[0];
    pickFile(file);
  });

  // Paste from clipboard (screenshot -> Cmd/Ctrl+V)
  document.addEventListener('paste', (e) => {
    const items = e.clipboardData && e.clipboardData.items;
    if (!items) return;
    for (const item of items) {
      if (item.type.startsWith('image/')) {
        pickFile(item.getAsFile());
        break;
      }
    }
  });

  runBtn.addEventListener('click', async () => {
    if (!selectedFile) return;
    const controller = new AbortController();
    activeController = controller;
    setBusy(true);
    resultPanel.classList.add('hidden');

    const isDeepseek = engineSel.value === 'deepseek';
    const startedAt = Date.now();
    statusEl.className = 'status';
    statusEl.innerHTML = '<span class="spinner"></span>Розпізнаю... 0 с';
    statusEl.scrollIntoView({ block: 'nearest', behavior: scrollBehavior() });
    const ticker = setInterval(() => {
      const s = Math.round((Date.now() - startedAt) / 1000);
      statusEl.innerHTML = '<span class="spinner"></span>Розпізнаю... ' + s + ' с'
        + (isDeepseek && s > 60 ? ' (на слабкому залізі це може тривати кілька хвилин)' : '');
    }, 1000);

    const form = new FormData();
    form.append('mode', modeSel.value);
    const output = isDeepseek ? 'json' : outputSel.value;
    form.append('output', output);
    form.append('engine', engineSel.value);
    if (isDeepseek) {
      const profile = selectedProfile();
      form.append('max_megapixels', profile.megapixels);
      form.append('max_predict', profile.maxPredict);
    }

    const headers = {};
    if (tokenInput.value.trim()) {
      headers['Authorization'] = 'Bearer ' + tokenInput.value.trim();
    }

    try {
      form.append('file', await imageToSend());
      const resp = await fetch('/ocr', {
        method: 'POST', body: form, headers, signal: controller.signal,
      });
      if (resp.status === 401) {
        tokenRow.classList.remove('hidden');
        tokenInput.focus();
        throw new Error('сервер вимагає API токен. Введи його й натисни «' + runBtn.textContent + '» ще раз');
      }
      if (!resp.ok) {
        const data = await resp.json().catch(() => ({}));
        throw new Error(typeof data.detail === 'string'
          ? data.detail
          : 'сервер повернув помилку (HTTP ' + resp.status + ')');
      }
      const seconds = fmtSeconds((Date.now() - startedAt) / 1000);
      resultRendered.classList.toggle('words', output === 'tsv');
      confLegend.classList.toggle('hidden', output !== 'tsv');
      if (output === 'pdf') {
        download(await resp.blob(), selectedFile.name.replace(/\.[^.]*$/, '') + '.pdf');
        setStatus('PDF створено за ' + seconds + ' с', 'ok');
        return;
      }
      if (output === 'tsv') {
        resultText.value = renderWords(await resp.text());
        resultPanel.classList.remove('hidden');
        resultRendered.classList.remove('hidden');
        resultText.classList.add('hidden');
        setStatus('Готово за ' + seconds + ' с', 'ok');
        showResult();
        return;
      }
      const data = await resp.json();
      resultText.value = data.text || '';
      resultPanel.classList.remove('hidden');
      resultRendered.classList.add('hidden');
      resultText.classList.remove('hidden');
      if (data.truncated) {
        // The server's warning names the actual cause (loop, token limit, time limit).
        setStatus('Готово за ' + fmtSeconds(data.seconds) + ' с. ' + (data.warning || 'Текст може бути неповним.'), 'err');
      } else {
        setStatus('Готово за ' + fmtSeconds(data.seconds) + ' с', 'ok');
      }
      showResult();
    } catch (err) {
      if (err.name === 'AbortError') {
        setStatus('Розпізнавання зупинено');
      } else {
        setStatus('Помилка: ' + err.message, 'err');
      }
    } finally {
      clearInterval(ticker);
      if (activeController === controller) {
        activeController = null;
        setBusy(false);
      }
    }
  });

  const scrollBehavior = () => matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth';
  function showResult() {
    resultPanel.scrollIntoView({ behavior: scrollBehavior(), block: 'start' });
  }

  // Ctrl/Cmd+Enter starts recognition from anywhere, including the textarea.
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && !runBtn.disabled) runBtn.click();
  });

  // Tooltips don't show on touch screens, so a tap shows the confidence too.
  resultRendered.addEventListener('click', (e) => {
    if (resultRendered.classList.contains('words') && e.target.title) setStatus(e.target.title);
  });

  downloadBtn.addEventListener('click', () => {
    download(new Blob([resultText.value], { type: 'text/plain;charset=utf-8' }),
      selectedFile.name.replace(/\.[^.]*$/, '') + '.txt');
  });

  stopBtn.addEventListener('click', () => {
    if (!activeController) return;
    stopBtn.disabled = true;
    setStatus('Зупиняю розпізнавання...');
    activeController.abort();
  });

  copyBtn.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(resultText.value);
      copyBtn.textContent = 'Скопійовано!';
    } catch {
      resultText.select();
      document.execCommand('copy');
      copyBtn.textContent = 'Скопійовано!';
    }
    setTimeout(() => { copyBtn.textContent = 'Скопіювати'; }, 1500);
  });
</script>
</body>
</html>
