<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GLM-OCR</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f5f7;
    --panel: #ffffff;
    --border: #d8d8dd;
    --text: #1c1c1e;
    --muted: #6b6b70;
    --accent: #2f6fed;
    --accent-hover: #2559c4;
    --ok: #1a7f37;
    --err: #c0392b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121214;
      --panel: #1c1c1f;
      --border: #303034;
      --text: #f0f0f2;
      --muted: #9a9aa0;
      --accent: #5b8def;
      --accent-hover: #7ba3f2;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 16px;
  }
  .wrap { max-width: 780px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 8px 0 4px; }
  .sub { color: var(--muted); font-size: 14px; margin-bottom: 20px; }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
  }

  .dropzone {
    border: 2px dashed var(--border);
    border-radius: 10px;
    padding: 32px 16px;
    text-align: center;
    cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .dropzone.drag { border-color: var(--accent); background: rgba(47,111,237,.06); }
  .dropzone p { margin: 6px 0; color: var(--muted); font-size: 14px; }
  .dropzone strong { color: var(--text); }
  #fileInput { display: none; }

  #preview {
    max-width: 100%;
    max-height: 260px;
    border-radius: 8px;
    margin-top: 14px;
    display: none;
  }

  .row {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
    margin-top: 16px;
  }

  select, button {
    font-size: 14px;
    padding: 9px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
  }

  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    cursor: pointer;
    font-weight: 600;
  }
  button.primary:hover { background: var(--accent-hover); }
  button.primary:disabled { opacity: .5; cursor: default; }

  button.ghost { cursor: pointer; }
  button.ghost:hover { background: var(--bg); }

  button.stop {
    color: var(--err);
    border-color: currentColor;
    cursor: pointer;
    font-weight: 600;
  }
  button.stop:hover { background: color-mix(in srgb, var(--err) 10%, var(--panel)); }
  button.stop:disabled { opacity: .5; cursor: default; }

  .dropzone.busy { cursor: wait; opacity: .6; pointer-events: none; }

  .status { font-size: 13px; margin-left: auto; color: var(--muted); }
  .status.ok { color: var(--ok); }
  .status.err { color: var(--err); }
  .profile-hint { color: var(--muted); font-size: 12px; }

  textarea {
    width: 100%;
    min-height: 220px;
    margin-top: 14px;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 13px;
    line-height: 1.5;
    resize: vertical;
  }

  .markdown-body {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px 18px;
    margin-top: 14px;
    max-height: 460px;
    overflow: auto;
    line-height: 1.55;
  }
  .markdown-body h1, .markdown-body h2, .markdown-body h3 {
    margin-top: 1.2em;
    margin-bottom: .4em;
  }
  .markdown-body h1:first-child, .markdown-body h2:first-child, .markdown-body h3:first-child {
    margin-top: 0;
  }
  .markdown-body table {
    border-collapse: collapse;
    width: 100%;
    margin: 10px 0;
    font-size: 14px;
  }
  .markdown-body th, .markdown-body td {
    border: 1px solid var(--border);
    padding: 6px 10px;
    text-align: left;
  }
  .markdown-body code {
    background: rgba(127,127,127,.15);
    padding: 1px 5px;
    border-radius: 4px;
    font-size: 13px;
  }
  .markdown-body ul, .markdown-body ol { padding-left: 1.4em; }

  .hidden { display: none !important; }
  .spinner {
    width: 14px; height: 14px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .7s linear infinite;
    display: inline-block;
    vertical-align: -2px;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="wrap">
  <h1>GLM-OCR</h1>
  <div class="sub">Завантаж зображення — отримай розпізнаний текст</div>

  <div class="panel">
    <div class="dropzone" id="dropzone">
      <p><strong>Перетягни зображення сюди</strong> або натисни, щоб обрати файл</p>
      <p>PNG, JPG, WEBP</p>
      <input type="file" id="fileInput" accept="image/*">
    </div>
    <img id="preview" alt="Прев'ю">

    <div class="row">
      <select id="engine" aria-label="Рушій розпізнавання" title="Рушій розпізнавання">
        <option value="tesseract" selected>Швидко (Tesseract)</option>
        <option value="deepseek">Точно (DeepSeek)</option>
      </select>
      <select id="speedProfile" aria-label="Швидкість і якість" title="Швидкість і якість">
        <option value="fast">Швидко</option>
        <option value="balanced" selected>Збалансовано</option>
        <option value="detailed">Точно</option>
      </select>
      <span class="profile-hint" id="profileHint"></span>
      <select id="mode">
        <option value="text">Текст</option>
        <option value="table">Таблиця</option>
        <option value="figure">Фігура/схема</option>
        <option value="document">Документ (Markdown)</option>
      </select>
      <button class="primary" id="runBtn" disabled>Розпізнати</button>
      <button class="stop hidden" id="stopBtn" type="button">Зупинити</button>
      <span class="status" id="status"></span>
    </div>
    <div class="row" id="tokenRow" style="margin-top:10px">
      <input type="password" id="tokenInput" placeholder="API токен (якщо увімкнено на сервері)"
             style="flex:1; min-width:220px; font-size:13px; padding:8px 10px; border-radius:8px; border:1px solid var(--border); background:var(--panel); color:var(--text)">
    </div>
  </div>

  <div class="panel hidden" id="resultPanel">
    <div class="row" style="margin-top:0">
      <strong>Результат</strong>
      <button class="ghost hidden" id="viewToggleBtn" style="margin-left:auto">Сирий Markdown</button>
      <button class="ghost" id="copyBtn" style="margin-left:0">Скопіювати</button>
    </div>
    <div id="resultRendered" class="markdown-body hidden"></div>
    <textarea id="resultText" readonly></textarea>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.5/purify.min.js"></script>
<script>
  const dropzone = document.getElementById('dropzone');
  const fileInput = document.getElementById('fileInput');
  const preview = document.getElementById('preview');
  const runBtn = document.getElementById('runBtn');
  const stopBtn = document.getElementById('stopBtn');
  const engineSel = document.getElementById('engine');
  const speedProfile = document.getElementById('speedProfile');
  const profileHint = document.getElementById('profileHint');
  const modeSel = document.getElementById('mode');
  const statusEl = document.getElementById('status');
  const resultPanel = document.getElementById('resultPanel');
  const resultText = document.getElementById('resultText');
  const resultRendered = document.getElementById('resultRendered');
  const viewToggleBtn = document.getElementById('viewToggleBtn');
  const copyBtn = document.getElementById('copyBtn');
  const tokenInput = document.getElementById('tokenInput');

  let selectedFile = null;
  let isDocumentMode = false;
  let showingRendered = false;
  let activeController = null;
  const profiles = {
    fast: { megapixels: 0.5, maxPredict: 512, hint: '0,5 МП · до 512 токенів' },
    balanced: { megapixels: 1, maxPredict: 1024, hint: '1 МП · до 1024 токенів' },
    detailed: { megapixels: 2, maxPredict: 2048, hint: '2 МП · до 2048 токенів' },
  };

  function selectedProfile() {
    return profiles[speedProfile.value] || profiles.balanced;
  }

  function updateProfileHint() {
    profileHint.textContent = selectedProfile().hint;
  }

  function setBusy(busy) {
    runBtn.disabled = busy || !selectedFile;
    modeSel.disabled = busy;
    engineSel.disabled = busy;
    speedProfile.disabled = busy;
    tokenInput.disabled = busy;
    stopBtn.disabled = !busy;
    stopBtn.classList.toggle('hidden', !busy);
    dropzone.classList.toggle('busy', busy);
  }

  function renderMarkdownPreview() {
    if (!window.marked || !window.DOMPurify) {
      // CDN unreachable (offline homelab, blocked network) — fall back
      // to raw text so the feature degrades instead of breaking.
      showingRendered = false;
      return;
    }
    const html = DOMPurify.sanitize(marked.parse(resultText.value));
    resultRendered.innerHTML = html;
  }

  function setResultView(rendered) {
    showingRendered = rendered && isDocumentMode;
    resultRendered.classList.toggle('hidden', !showingRendered);
    resultText.classList.toggle('hidden', showingRendered);
    viewToggleBtn.textContent = showingRendered ? 'Сирий Markdown' : 'Показати як документ';
  }

  viewToggleBtn.addEventListener('click', () => setResultView(!showingRendered));
  speedProfile.addEventListener('change', updateProfileHint);
  updateProfileHint();

  // The speed profile only tunes DeepSeek (image size, token limit).
  function updateEngineUi() {
    const isDeepseek = engineSel.value === 'deepseek';
    speedProfile.classList.toggle('hidden', !isDeepseek);
    profileHint.classList.toggle('hidden', !isDeepseek);
  }
  try {
    const savedEngine = localStorage.getItem('glm_ocr_engine');
    if ([...engineSel.options].some(o => o.value === savedEngine)) engineSel.value = savedEngine;
  } catch {}
  engineSel.addEventListener('change', () => {
    try { localStorage.setItem('glm_ocr_engine', engineSel.value); } catch {}
    updateEngineUi();
  });
  updateEngineUi();

  try {
    tokenInput.value = localStorage.getItem('glm_ocr_token') || '';
  } catch {}
  tokenInput.addEventListener('change', () => {
    try { localStorage.setItem('glm_ocr_token', tokenInput.value); } catch {}
  });

  function setStatus(text, kind) {
    statusEl.textContent = text || '';
    statusEl.className = 'status' + (kind ? ' ' + kind : '');
  }

  function pickFile(file) {
    if (activeController) return;
    if (!file || !file.type.startsWith('image/')) {
      setStatus('Обери файл зображення', 'err');
      return;
    }
    selectedFile = file;
    preview.src = URL.createObjectURL(file);
    preview.style.display = 'block';
    setBusy(false);
    setStatus('');
    resultPanel.classList.add('hidden');
  }

  dropzone.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', (e) => pickFile(e.target.files[0]));

  ['dragenter', 'dragover'].forEach(evt =>
    dropzone.addEventListener(evt, (e) => { e.preventDefault(); dropzone.classList.add('drag'); })
  );
  ['dragleave', 'drop'].forEach(evt =>
    dropzone.addEventListener(evt, (e) => { e.preventDefault(); dropzone.classList.remove('drag'); })
  );
  dropzone.addEventListener('drop', (e) => {
    const file = e.dataTransfer.files && e.dataTransfer.files[0];
    pickFile(file);
  });

  // Paste from clipboard (screenshot -> Cmd/Ctrl+V)
  document.addEventListener('paste', (e) => {
    const items = e.clipboardData && e.clipboardData.items;
    if (!items) return;
    for (const item of items) {
      if (item.type.startsWith('image/')) {
        pickFile(item.getAsFile());
        break;
      }
    }
  });

  runBtn.addEventListener('click', async () => {
    if (!selectedFile) return;
    const controller = new AbortController();
    activeController = controller;
    setBusy(true);
    resultPanel.classList.add('hidden');

    const isDeepseek = engineSel.value === 'deepseek';
    const startedAt = Date.now();
    statusEl.className = 'status';
    statusEl.innerHTML = '<span class="spinner"></span>Розпізнаю... 0 с';
    const ticker = setInterval(() => {
      const s = Math.round((Date.now() - startedAt) / 1000);
      statusEl.innerHTML = '<span class="spinner"></span>Розпізнаю... ' + s + ' с'
        + (isDeepseek && s > 60 ? ' (на слабкому залізі це може тривати кілька хвилин)' : '');
    }, 1000);

    const form = new FormData();
    form.append('file', selectedFile);
    form.append('mode', modeSel.value);
    form.append('output', 'json');
    form.append('engine', engineSel.value);
    if (isDeepseek) {
      const profile = selectedProfile();
      form.append('max_megapixels', profile.megapixels);
      form.append('max_predict', profile.maxPredict);
    }

    const headers = {};
    if (tokenInput.value.trim()) {
      headers['Authorization'] = 'Bearer ' + tokenInput.value.trim();
    }

    try {
      const resp = await fetch('/ocr', {
        method: 'POST', body: form, headers, signal: controller.signal,
      });
      const data = await resp.json().catch(() => ({}));
      if (!resp.ok) {
        throw new Error(typeof data.detail === 'string'
          ? data.detail
          : 'сервер повернув помилку (HTTP ' + resp.status + ')');
      }
      resultText.value = data.text || '';
      resultPanel.classList.remove('hidden');
      // Tesseract returns plain text, so there is no Markdown to render.
      isDocumentMode = data.mode === 'document' && data.engine !== 'tesseract';
      viewToggleBtn.classList.toggle('hidden', !isDocumentMode);
      if (isDocumentMode) {
        renderMarkdownPreview();
        setResultView(true);
      } else {
        setResultView(false);
      }
      if (data.truncated) {
        setStatus('Готово за ' + data.seconds + ' с, але схоже на зациклення (обрізано за лімітом токенів)', 'err');
      } else {
        setStatus('Готово за ' + data.seconds + ' с', 'ok');
      }
    } catch (err) {
      if (err.name === 'AbortError') {
        setStatus('Розпізнавання зупинено');
      } else {
        setStatus('Помилка: ' + err.message, 'err');
      }
    } finally {
      clearInterval(ticker);
      if (activeController === controller) {
        activeController = null;
        setBusy(false);
      }
    }
  });

  stopBtn.addEventListener('click', () => {
    if (!activeController) return;
    stopBtn.disabled = true;
    setStatus('Зупиняю розпізнавання...');
    activeController.abort();
  });

  copyBtn.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(resultText.value);
      copyBtn.textContent = 'Скопійовано!';
    } catch {
      resultText.select();
      document.execCommand('copy');
      copyBtn.textContent = 'Скопійовано!';
    }
    setTimeout(() => { copyBtn.textContent = 'Скопіювати'; }, 1500);
  });
</script>
</body>
</html>
